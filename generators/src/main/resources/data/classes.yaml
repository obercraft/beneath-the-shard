archetypes:
  warrior:
    section: Warrior Classes
    intro: Warrior classes forge steel and stubborn will against the Star-Grave.
    classes:
    - name: Iron Vanguard
      hook: A living wall of plate and oath. Holds the gate while others bleed for crystal.
    - name: Ashblade
      hook: Burns brighter the closer death leans in. Favors brutal finishing cuts.
    - name: Tunnel Knight
      hook: Veteran of collapsing shafts and black chokepoints. Master of cramped zones.
    - name: Crucible Veteran
      hook: Tempered in guild smelters and punishment pits. Trades pain for momentum.
    - name: Oathbreaker
      hook: Cast out of every banner that mattered. Turns betrayal into ruthless leverage.
  rogue:
    section: Rogue Classes
    intro: Rogue classes cut contracts, throats, and escape routes through the underworld.
    classes:
    - name: Gatecutter
      hook: Specialist in Shard-Gate breaches, locks, and killing whoever holds the key.
    - name: Veinstalker
      hook: Hunts along crystal veins where light lies and sound dies.
    - name: Debtknife
      hook: Collector for Mining Guild ledgers written in blood and interest.
    - name: Glasshand
      hook: Fights with shard-slivers and poisoned grit; precision over spectacle.
    - name: Night Broker
      hook: Buys silence, sells ambushes, and always keeps a second price ready.
  mage:
    section: Mage Classes
    intro: Mage classes bend Aether-Glass until it sings---or screams.
    classes:
    - name: Aetherwright
      hook: Crafts volatile patterns of raw shard-light into bolts and barriers.
    - name: Resonance Cantor
      hook: Sings the crystal's frequency until minds crack and stone answers.
    - name: Voidbinder
      hook: Pins fragments of the dead world into temporary, hungry cages.
    - name: Dust Alchemist
      hook: Grinds relics into powders that heal, burn, or rewrite flesh.
    - name: Prism Seer
      hook: Reads fractured futures in glass and steers the party through the worst ones.
