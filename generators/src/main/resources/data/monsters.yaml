tiers:
- lo: 1
  hi: 40
  title: Minions
  intro: Small hungers, swarms, and hired knives. Cheap Threat, ugly deaths.
- lo: 41
  hi: 75
  title: Brutes \& Skirmishers
  intro: Heavy meat and mid-dark predators. They set the tempo of a delve.
- lo: 76
  hi: 95
  title: Elites
  intro: Named dangers, cult blades, and guild engines. Threat often rolls d8.
- lo: 96
  hi: 100
  title: Horrors
  intro: Apocalypse fragments. Budget carefully---or not at all.
diffMacros:
  E: \easy
  M: \medium
  H: \hard{} \hard{}
  G: \grand{} \energy{1}
  D: \dire{} \energy{1}
  F: \fell{} \energy{2}
minions:
- name: Vein Tick
  appearance: Fist-sized crystal mites with translucent carapaces veined in amber light; needle-legs click like abacus beads.
  behavior: They fatten on warm Aether-Glass seams, close into a fighter's zone, bite, then latch so the victim cannot flee.
  lore: Crystal mites fatten in warm Aether-Glass seams. Miners call their bites ``ledger kisses''---cheap wounds that open
    the way for worse hungers deeper in.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Close In
    diff: E
    effect: If not sharing a zone with a character, Move toward the nearest one.
  - name: Bite
    diff: M
    effect: Deal 1 hit to one character in its zone.
  - name: Latch
    diff: H
    effect: Deal 1 hit; that character cannot Move next round.
- name: Ash Rat
  appearance: Soot-grey rats the size of cats, eyes like cooling cinders, whiskers stiff with slag dust.
  behavior: Nest in cooled ash beds; skitter between zones, nip ankles, and scatter when struck to spoil the next Strike.
  lore: After the Falling Sun, ash vermin learned to nest in cooled slag. They fear little except bright flame, and they remember
    the smell of rations.
  pool: 1d6
  hits: 1
  deploy: Swarm
  threat: d6
  actions:
  - name: Skitter
    diff: E
    effect: Move to an adjacent zone.
  - name: Nip
    diff: E
    effect: Deal 1 hit to a character in its zone.
  - name: Scatter
    diff: M
    effect: Move; the next Strike against it this round needs +1 face.
- name: Glass Mite
  appearance: Nearly invisible parasites, thin as fingernail shavings, that catch light only when they move.
  behavior: Cling to boots and blades; crawl toward heat and bite through Guard as if armor were rumor.
  lore: Transparent parasites cling to boots and blades. When crushed they scream like cooling glass---music that draws larger
    shardlings.
  pool: 1d6
  hits: 1
  deploy: Swarm
  threat: d6
  actions:
  - name: Crawl
    diff: E
    effect: Move toward nearest character.
  - name: Shard Bite
    diff: M
    effect: Deal 1 hit; ignore Guard.
- name: Cave Urchin
  appearance: A rolling knot of calcite spines dripping shard-water, marrow stains between the points.
  behavior: Tumbles into occupied zones and flares spines to catch everyone who shares the space.
  lore: Calcite spines grow where shard-water drips. Roll into a corridor and they become living caltrops with a taste for
    marrow.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Roll
    diff: E
    effect: Move into a character's zone.
  - name: Spine
    diff: M
    effect: Deal 1 hit to each character in its zone (max 2).
- name: Drip Slime
  appearance: Slow curtains of vault runoff, opalescent and smelling of wet copper; surface quivers like held breath.
  behavior: Oozes patiently, engulfs to strip Guard, and splits when pressed---teaching the dungeon to multiply.
  lore: Condensed runoff from crystal vaults, slow and patient. Split them and you only teach the dungeon to multiply.
  pool: 2d6
  hits: 2
  deploy: Mid
  threat: d6
  actions:
  - name: Ooze
    diff: E
    effect: Move to adjacent zone.
  - name: Engulf
    diff: M
    effect: Deal 1 hit; character loses Guard.
  - name: Split Drip
    diff: H
    effect: 'Spawn: place another Drip Slime with 1 Hit in an adjacent zone (once per fight).'
- name: Gloom Bat
  appearance: Blind leather wings from the upper dark, throats ridged for screech, faces all membrane and needle teeth.
  behavior: Swoops from Rear across two zones, then bleed-screeches so Aid dies in the throat.
  lore: Blind wings from the Star-Grave's upper dark. Their screech unravels courage faster than it sheds blood.
  pool: 1d6
  hits: 1
  deploy: Rear
  threat: d6
  actions:
  - name: Swoop
    diff: E
    effect: Move to a character's zone from up to two zones away.
  - name: Bleed Screech
    diff: M
    effect: Deal 1 hit; that character cannot Aid this round.
- name: Bone Maggot
  appearance: Fat white worms thick as thumbs, guild brand-scars still pink on their rings of flesh.
  behavior: Hatch in mass graves; write toward meat already opened and gnaw the wounded.
  lore: Fat white worms that hatch in guild mass graves. They prefer meat already opened by someone else's victory.
  pool: 1d6
  hits: 1
  deploy: Swarm
  threat: d6
  actions:
  - name: Burrow Edge
    diff: E
    effect: Move.
  - name: Gnaw
    diff: E
    effect: Deal 1 hit to a character who took a hit this round.
- name: Rust Beetle
  appearance: Fist-sized iron-eaters with orange-brown shells and saliva that stinks of spoiled oil.
  behavior: Clack toward the nearest steel, then corrode so Medium strikes cost extra energy.
  lore: Iron-eaters bred in neglected armories. Their saliva turns Medium strikes into costly gambles.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Clack
    diff: E
    effect: Move adjacent to nearest character.
  - name: Corrode
    diff: M
    effect: Deal 1 hit; next Strike by that character costs +1 energy if Medium.
- name: Shardling Scout
  appearance: Palm-sized crystalline runners, facets cut like courier seals, leaving glitter trails.
  behavior: Advance toward Z1, cut once, and signal kin so the pack treats approach as already done.
  lore: Tiny crystalline scouts that report to something larger. Kill one and others still know your route.
  pool: 2d6
  hits: 2
  deploy: Mid
  threat: d6
  actions:
  - name: Advance
    diff: E
    effect: Move toward Z1.
  - name: Crystal Cut
    diff: M
    effect: Deal 1 hit.
  - name: Signal
    diff: H
    effect: All other Shardlings treat Close In as already satisfied this round.
- name: Tunnel Leech
  appearance: Pale ribbon-bodies in flooded shafts, mouths a ring of glass teeth that drink warmth.
  behavior: Slither into occupied zones and drain hits into their own slick vigor.
  lore: Pale ribbons in flooded shafts. They drink heat and return it as stolen vigor to their own slick bodies.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Slither
    diff: E
    effect: Move into occupied zone.
  - name: Drain
    diff: M
    effect: Deal 1 hit; monster heals 1 hit (max Hits).
- name: Ember Moth
  appearance: Ash-Frontier moths with wings of glowing dust; beautiful, then choking.
  behavior: Flutter close and singe; the burn lingers into the next round unless Guarded.
  lore: Ash Frontier pests whose wings shed burning dust. Beautiful until the singe settles into your lungs.
  pool: 1d6
  hits: 1
  deploy: Swarm
  threat: d6
  actions:
  - name: Flutter
    diff: E
    effect: Move.
  - name: Singe
    diff: M
    effect: 'Deal 1 hit; ongoing: 1 hit next round unless Guarded.'
- name: Pit Viper
  appearance: Punishment-pit serpents, scales matte black, fangs beaded with anti-Guard venom.
  behavior: Coil to Guard themselves, strike clean, then venom so the target cannot Guard next round.
  lore: Vipers that nested in punishment pits and learned to wait beside ladders. Venom denies the mercy of Guard.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Coil
    diff: E
    effect: Gain Guard.
  - name: Strike
    diff: M
    effect: Deal 1 hit.
  - name: Venom
    diff: H
    effect: Deal 1 hit; character cannot Guard next round.
- name: Carrion Crow
  appearance: Surface crows gone wrong on crystal offal---feathers edged in glass, beaks notched like map knives.
  behavior: Circle from Rear, then peck eyes and plans alike, spoiling the next die face.
  lore: Surface birds gone wrong on crystal offal. They circle retreats and peck at maps as readily as eyes.
  pool: 1d6
  hits: 1
  deploy: Rear
  threat: d6
  actions:
  - name: Circle
    diff: E
    effect: Move to Rear-most empty adjacent step toward party.
  - name: Eye Peck
    diff: M
    effect: Deal 1 hit; -1 face on that character's next die.
- name: Fungal Spore
  appearance: Breathing clouds of lacunae mold, almost bodyless until they choke a corridor.
  behavior: Drift, then choke so Hard Hard actions fail in the coughing dark.
  lore: Breathing clouds from lacunae cults left untended. Choking them is half the fight; the rest is not singing their spore-song.
  pool: 1d6
  hits: 1
  deploy: Swarm
  threat: d6
  actions:
  - name: Drift
    diff: E
    effect: Move.
  - name: Choke
    diff: M
    effect: Deal 1 hit; character cannot use Hard Hard this round.
- name: Mine Wight Pup
  appearance: Half-formed dead still wearing smoking guild brands; limbs too long, jaws unhinged.
  behavior: Shamble toward living warmth and claw with leftover miner hate.
  lore: Half-formed dead that never left the claim. They shamble toward living warmth with guild brands still smoking on their
    wrists.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Shamble
    diff: E
    effect: Move toward nearest character.
  - name: Claw
    diff: M
    effect: Deal 1 hit.
- name: Crystal Gnat Cloud
  appearance: A glittering thought of wings---thousands of mote-insects thinking as one refraction.
  behavior: Swarm-moves as a cloud, stings everyone in the zone, disperses to shrug a hit and relocate.
  lore: A swarm that thinks as one glitter. Disperse it and it laughs in a thousand tiny refractions.
  pool: 2d6
  hits: 3
  deploy: Swarm
  threat: d6
  actions:
  - name: Swarm Move
    diff: E
    effect: Move.
  - name: Sting Cloud
    diff: M
    effect: Deal 1 hit to every character in its zone.
  - name: Disperse
    diff: H
    effect: Ignore the next hit; Move.
- name: Debt Thug
  appearance: Ledger-hired muscle in patched leather, Guild chalk marks on knuckles, cudgels wrapped in interest notes.
  behavior: Press into a zone, club hard, and shake down fleeing parties for +Debt.
  lore: Muscle rented by Mining Guild ledgers. They break bones to keep interest flowing and flee only when the coin stops.
  pool: 2d6
  hits: 3
  deploy: Front
  threat: d6
  actions:
  - name: Press
    diff: E
    effect: Move into a character's zone.
  - name: Club
    diff: M
    effect: Deal 1 hit.
  - name: Shake Down
    diff: H
    effect: Deal 1 hit; party marks +1 Debt if they flee this fight.
- name: Gate Urchin
  appearance: Spined cling-beasts colonizing Gate rims like living locks; shells etched by threshold weather.
  behavior: Cling when on Gate terrain for Guard, then spike anyone sharing or adjacent to the threshold.
  lore: Spined cling-beasts that colonize Gate rims. Touch the threshold and they wake like a lock picking you.
  pool: 2d6
  hits: 2
  deploy: Mid
  threat: d6
  actions:
  - name: Cling
    diff: E
    effect: If on Gate terrain (Z5), gain Guard.
  - name: Spike
    diff: M
    effect: Deal 1 hit to character in same or adjacent zone.
- name: Soot Imp
  appearance: Knee-high forge-mockeries of ash and spite, grins too wide, fingers tipped in cinder.
  behavior: Cackle-step, flick burning grit into adjacent zones, and smoke the corridor so Strikes need higher faces.
  lore: Little mockeries born of forge smoke and spite. They flick cinders and teach corridors to lie about distance.
  pool: 2d6
  hits: 2
  deploy: Mid
  threat: d6
  actions:
  - name: Cackle Step
    diff: E
    effect: Move.
  - name: Cinder Flick
    diff: M
    effect: Deal 1 hit to adjacent zone.
  - name: Smoke
    diff: H
    effect: Characters in its zone treat Strike as needing +1 face.
- name: Pale Centipede
  appearance: Segmented mid-dark hunters, each plate a dull pearl, legs like sewing needles.
  behavior: Undulate through monster zones, mandible-bite, then coil-bind so Move dies.
  lore: Segmented hunters of the mid-dark. Coil once around an ankle and the Star-Grave owns your next step.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Undulate
    diff: E
    effect: Move; may pass through a monster zone.
  - name: Mandible
    diff: M
    effect: Deal 1 hit.
  - name: Coil Bind
    diff: H
    effect: Deal 1 hit; character cannot Move.
- name: Scrap Hound
  appearance: Feral dogs fused to slag collars and broken chain; ribs show like ledger lines.
  behavior: Bay at lone targets, maul, and drag meat toward Z5 as offerings.
  lore: Feral dogs fused with slag collars. They bay for lone stragglers and drag meat toward Z5 as offerings.
  pool: 2d6
  hits: 3
  deploy: Front
  threat: d6
  actions:
  - name: Bay
    diff: E
    effect: Move toward a character who is alone in their zone.
  - name: Maul
    diff: M
    effect: Deal 1 hit.
  - name: Drag
    diff: H
    effect: Deal 1 hit; Move that character one zone toward Z5.
- name: Lantern Jelly
  appearance: Wet-vault hangers pulsing soft gold-green light through translucent bells.
  behavior: Pulse to ruin stealth, then sting whatever the light revealed.
  lore: Bioluminescent hangers in wet vaults. Their pulse reveals every stealth you thought you bought.
  pool: 1d6
  hits: 2
  deploy: Mid
  threat: d6
  actions:
  - name: Pulse
    diff: E
    effect: All characters in adjacent zones are revealed (no stealth).
  - name: Sting
    diff: M
    effect: Deal 1 hit.
- name: Ore Tick
  appearance: Magnetic parasites the size of fists, shells iron-flecked, drawn to plate and hammers.
  behavior: Crawl to the most metal-clad foe and suck spark---hits plus stolen energy.
  lore: Magnetic parasites that prefer plate and hammers. Warriors feel them first---then miss the energy they siphon.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Magnet Crawl
    diff: E
    effect: Move into zone with most metal (Warrior preferred).
  - name: Suck Spark
    diff: M
    effect: Deal 1 hit; steal 1 energy if that character would spend any this round.
- name: Grave Larva
  appearance: Soft white death-seeds from shallow graves above Gates; blind heads questing.
  behavior: Writhe close and burrow hardest into those already nearly fallen.
  lore: Soft white deaths seeded in shallow graves above Gates. They finish what duels begin.
  pool: 1d6
  hits: 1
  deploy: Swarm
  threat: d6
  actions:
  - name: Writhe
    diff: E
    effect: Move.
  - name: Burrow Flesh
    diff: M
    effect: Deal 1 hit to a character at 1 hit remaining, or 1 hit otherwise.
- name: Echo Sprig
  appearance: Twig-thin mimics with knot faces; bark that looks like boot leather at a glance.
  behavior: Copy a recent Move destination, false-call to cancel Aid, then shatter-chirp the zone.
  lore: Twig-thin mimics that steal footfalls. Fight one and you may strike your own last Move by mistake.
  pool: 2d6
  hits: 2
  deploy: Rear
  threat: d6
  actions:
  - name: Mimic Step
    diff: E
    effect: Move to copy a character's last Move destination if adjacent path exists.
  - name: False Call
    diff: M
    effect: Cancel one Aid this round.
  - name: Shatter Chirp
    diff: H
    effect: Deal 1 hit to all in its zone.
- name: Blindfish Walker
  appearance: Cave fish that grew wrong legs when light died; milky eyes, gulping mouths.
  behavior: Slap-walk forward and gulp dark until the floor becomes difficult syrup.
  lore: Cave fish that grew legs when light died. Their gulp turns floors into black syrup.
  pool: 2d6
  hits: 2
  deploy: Mid
  threat: d6
  actions:
  - name: Slap
    diff: E
    effect: Move.
  - name: Gulp Dark
    diff: M
    effect: Deal 1 hit; zone becomes difficult (Moves Hard Hard) until cleared.
- name: Nail Sprite
  appearance: Needle-thin forge fairies, laughter like filing metal, fingers all punctures.
  behavior: Dart, puncture pride, and rust-laugh so the next Guard fails automatically.
  lore: Needle fairies from blackmarket forges. They puncture pride and laugh rust into your Guard.
  pool: 1d6
  hits: 1
  deploy: Swarm
  threat: d6
  actions:
  - name: Dart
    diff: E
    effect: Move.
  - name: Puncture
    diff: E
    effect: Deal 1 hit.
  - name: Rust Laugh
    diff: M
    effect: Character's next Guard fails automatically.
- name: Cinder Beetle
  appearance: Furnace vermin that glow white before they burst; shells cracked with heat.
  behavior: Glow for Guard, then burst for zone damage at the cost of their own Hits.
  lore: Furnace vermin that glow before they burst. Stand close and share their suicide.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Glow
    diff: E
    effect: Gain Guard.
  - name: Burst
    diff: M
    effect: Deal 1 hit to its zone; take 1 hit itself.
- name: Tunnel Brat
  appearance: Feral children of failed delves---rock in hand, eyes like unpaid debt, clothes of rope and rag.
  behavior: Chuck rocks into adjacent zones, run toward Z5, and jeer until Strikes must answer them.
  lore: Feral children of failed delves, rock in hand, eyes like unpaid debt. They run deeper when blood spills.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Chuck Rock
    diff: M
    effect: Deal 1 hit to adjacent zone.
  - name: Run
    diff: E
    effect: Move toward Z5.
  - name: Jeer
    diff: H
    effect: Nearest character must target this monster if they Strike this round.
- name: Shard Flea
  appearance: Leaping glass fleas that treat distance as a joke; bodies like broken lenses.
  behavior: Hop up to two zones and bite whatever lands under them.
  lore: Leaping glass fleas that treat zones as jokes. Hop twice and they are already at your throat.
  pool: 1d6
  hits: 1
  deploy: Swarm
  threat: d6
  actions:
  - name: Hop
    diff: E
    effect: Move up to two zones.
  - name: Bite
    diff: E
    effect: Deal 1 hit.
- name: Muck Crab
  appearance: Quarantine-shore crabs armored in salt scab and plague-banner dyes.
  behavior: Sideways into reach, claw, then pinch gear so archetype tricks seize up.
  lore: Quarantine-shore crabs armored in salt scab. Pinch a gauntlet and archetype tricks seize up.
  pool: 2d6
  hits: 3
  deploy: Front
  threat: d6
  actions:
  - name: Sideways
    diff: E
    effect: Move.
  - name: Claw
    diff: M
    effect: Deal 1 hit.
  - name: Pinch Gear
    diff: H
    effect: Deal 1 hit; character cannot use archetype actions next round.
- name: Whisper Moth
  appearance: Soft-winged thieves of words; dust on wings looks like erased ink.
  behavior: Soft-wing without triggering entry hits, then steal a spoken Aid or keyword.
  lore: Soft-winged thieves of words. One brush and your Aid dies unspoken. Miners whisper its name when the Journey Clock
    runs thin.
  pool: 1d6
  hits: 1
  deploy: Rear
  threat: d6
  actions:
  - name: Soft Wing
    diff: E
    effect: Move without triggering entry hits.
  - name: Steal Word
    diff: M
    effect: Deal 1 hit; that character cannot use archetype actions until the next round.
- name: Bone Spur
  appearance: Calcified stakes that root in chokepoints; ivory stained with old marches.
  behavior: Plant for Guard if still, then impale anyone entering---or Strike in place.
  lore: Calcified stakes that plant themselves in chokepoints. Impale the eager; ignore the patient.
  pool: 2d6
  hits: 2
  deploy: Mid
  threat: d6
  actions:
  - name: Plant
    diff: E
    effect: If it does not Move, gain Guard.
  - name: Impale
    diff: M
    effect: Deal 1 hit to character entering its zone, or Strike in zone.
- name: Guild Rat
  appearance: Four-legged informants branded with guild ink; ears notched for routes sold.
  behavior: Flank beside other monsters, shiv, then call Debt when blood proves the tip.
  lore: Informants on four legs, branded with guild ink. Flank, shiv, then call the Debt in.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Flank
    diff: E
    effect: Move to a zone with a character and another monster.
  - name: Shiv
    diff: M
    effect: Deal 1 hit.
  - name: Call Debt
    diff: H
    effect: If it hits, mark +1 Debt.
- name: Static Polyp
  appearance: Anchored flesh-crystals arcing blue-white toward metal; roots fuse to stone.
  behavior: Refuse Moves, arc to same/adjacent targets, then discharge into every adjacent zone.
  lore: Anchored flesh-crystals that arc lightning toward metal. Discharge once and the corridor remembers.
  pool: 2d6
  hits: 2
  deploy: Mid
  threat: d6
  actions:
  - name: Anchor
    diff: E
    effect: Cannot be Moved this round.
  - name: Arc
    diff: M
    effect: Deal 1 hit to a character in same or adjacent zone.
  - name: Discharge
    diff: H
    effect: Deal 1 hit to all characters in adjacent zones.
- name: Dust Wisp
  appearance: Resonance leftovers given hunger---smoke with a suggestion of a face.
  behavior: Drift into lungs; choke-dust writes Stress as well as Hits.
  lore: Resonance leftovers given hunger. Drift into lungs and Stress writes itself. Miners whisper its name when the Journey
    Clock runs thin.
  pool: 1d6
  hits: 1
  deploy: Swarm
  threat: d6
  actions:
  - name: Drift
    diff: E
    effect: Move.
  - name: Choke Dust
    diff: M
    effect: Deal 1 hit; Stress +1 on that character if Resonance is tracked.
- name: Cave Spiderling
  appearance: Young of something still descending; too many eyes, silk that glitters like wire.
  behavior: Web lines tax Moves into their zone, then bite.
  lore: Young of something still descending. Webs tax every Move you thought was Easy. Miners whisper its name when the Journey
    Clock runs thin.
  pool: 2d6
  hits: 2
  deploy: Front
  threat: d6
  actions:
  - name: Web Line
    diff: E
    effect: 'Move; leave web: next foe Move into that zone costs Medium for characters.'
  - name: Bite
    diff: M
    effect: Deal 1 hit.
- name: Pyre Cub
  appearance: 'Ash Frontier predators still half-cub: soot fur, ember tongue, funeral smell.'
  behavior: Pounce into a zone, rake, and howl embers that cling into the next round.
  lore: Ash Frontier predators still half-cub, all hunger. Howl embers cling like unfinished funerals.
  pool: 2d6
  hits: 3
  deploy: Front
  threat: d6
  actions:
  - name: Pounce
    diff: E
    effect: Move into character zone.
  - name: Rake
    diff: M
    effect: Deal 1 hit.
  - name: Howl Embers
    diff: H
    effect: Deal 1 hit; character takes 1 hit at start of next round.
- name: Lead Slug
  appearance: Slow poison given weight---matte grey bulk that leaves toxic trails.
  behavior: Creep, then crush a toe so Escape and Move die together.
  lore: Slow poison given weight. Creep, crush, and deny Escape. Miners whisper its name when the Journey Clock runs thin.
  pool: 1d6
  hits: 3
  deploy: Mid
  threat: d6
  actions:
  - name: Creep
    diff: E
    effect: Move.
  - name: Crush Toe
    diff: M
    effect: Deal 1 hit; character cannot Move.
- name: Hollow Child Echo
  appearance: A Gate memory wearing a child's shape; edges flicker, smile too still.
  behavior: Beckon the nearest fighter deeper, cold-touch, then wail across adjacent zones.
  lore: A Gate memory wearing a child's shape. Beckon, touch, wail---and watch the party lean toward Z5.
  pool: 2d6
  hits: 2
  deploy: Rear
  threat: d6
  actions:
  - name: Beckon
    diff: E
    effect: Nearest character Moves one zone toward this monster if not Hard Hard resisted (assign any die 4+).
  - name: Cold Touch
    diff: M
    effect: Deal 1 hit.
  - name: Wail
    diff: H
    effect: All characters in adjacent zones take 1 hit.
brutes:
- name: Shard Brute
  appearance: Crystalline muscle grown where miners overfed a vein; fists like broken pillars, face a suggestion of ore.
  behavior: Advances, smashes for two hits, backhands crowds, and roars Guard away.
  lore: Crystalline muscle grown where miners fed the vein too greedily. It smashes first and learns names later.
  pool: 3d6
  hits: 5
  deploy: Front
  threat: d6
  actions:
  - name: Advance
    diff: E
    effect: Move toward nearest character.
  - name: Smash
    diff: M
    effect: Deal 2 hits to one character in its zone.
  - name: Backhand
    diff: H
    effect: Deal 1 hit to up to two characters in its zone.
  - name: Roar
    diff: M
    effect: Characters in its zone cannot Guard this round.
- name: Tunnel Ogre
  appearance: Old meat sealed under collapses; skin mapped with timber scars, club a fallen support beam.
