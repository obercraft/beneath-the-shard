mechanics:
- name: Journey Clock
  encounters:
  - title: Broken Causeway
    flavor: A shard-chasm splits the old royal road. Wind moans through crystal teeth below; one beam is all that remains
      of the bridge the Guild swore would last forever.
    stakes: 'A stone bridge over a shard-chasm has collapsed to a single beam. Advance the Journey Clock by 1 if you take
      the long way, or assign dice for a Medium crossing: failure drops one character for 1 hit and still advances the clock.'
  - title: Ash Wind Front
    flavor: The Ash Frontier exhales. Grit scours paint from shields and turns the sun into a rumor.
    stakes: 'A wall of volcanic grit blinds the road. Mark +1 Journey Clock. Camp now (see Campfire Counsel) or push on: Hard
      Hard to keep the map accurate; failure means you become Lost (resolve one extra encounter before the Gate).'
  - title: Refugee Column
    flavor: Families flee a Gate that woke hungry. Their hands are empty except for hope and the Guild brands on their wrists.
    stakes: Starving surface folk block the trail, begging for crystal dust. Give supplies (lose 1 energy from the party)
      or refuse and gain a Debt mark from their guild patrons later. Clock does not advance if you share.
  - title: Toll of the Free Companies
    flavor: Mercenary banners stitch the ridge. Coin or blood---they are not picky, only patient.
    stakes: Mercenaries claim this ridge. Pay a Favor owed or fight a short skirmish; either way the clock advances unless
      you sneak (Medium) past without payment.
  - title: Flooded Quarry Road
    flavor: Shard-heat melted the snow wrong. Black water fills the quarry cut like a held breath.
    stakes: 'Meltwater from shard-heat floods the path. Detour (+2 Journey Clock) or ford: each character risks 1 hit on a
      failed Easy swim/climb.'
  - title: False Milestone
    flavor: Someone twisted the waystones for a joke or a murder. Moss still grows toward the old true north.
    stakes: Someone rotated the waystones. Easy Insight/WIS-style check (assign Easy die) to notice; failure advances clock
      by 2 as you loop.
  - title: Night Herd
    flavor: Cattle with crystal cataracts thunder at dusk, lowing in frequencies that itch the teeth.
    stakes: 'Crystal-maddened cattle stampede at dusk. Scatter (all Move Easy) or hold the line (one Warrior Medium): failure
      deals 1 hit to a random character; success yields rations and clock stays.'
  - title: Signal Fires on the Ridge
    flavor: Three fires make a triangle the Free Companies use for ambush. Your fire would answer---or betray.
    stakes: Three fires form a triangle---ambush code. Advance clock by camping cold (+1 Stress if no fire) or light a counter-signal
      (Medium) to negotiate passage.
  - title: Collapsed Mining Sled
    flavor: A sled of raw glass lies broken, humming faintly. Scavengers' footprints circle like unfinished prayers.
    stakes: Abandoned sled of raw glass. Salvage (gain 1 energy crystal, +1 Resonance Stress) or leave it; scavengers later
      become a Debt encounter if you take it.
  - title: Border Plague Banner
    flavor: Yellow cloth and spears. The quarantine is half medicine, half tax.
    stakes: A kingdom quarantine blocks the high road. Bribe (pay Favor), detour (+2 clock), or forge papers (Hard Hard on
      Rogue/Mage).
  - title: Singing Rails
    flavor: Abandoned ore rails sing when the Shard pulses. Riding them feels like cheating the clock---and feeding it your
      nerves.
    stakes: Old ore rails hum with shard current. Traveling them cuts 1 clock but marks +1 Resonance Stress per character.
  - title: Guide Who Lies
    flavor: A smiling local offers a shortcut through thorn and rumor. Their eyes flick too often toward the Gate.
    stakes: A local guide offers a shortcut. Trust them (-1 clock, then roll a Gate Omen early) or dismiss them (clock +1,
      safe road).
  - title: River Ferry Strike
    flavor: Ferrymen want Aether-Glass, not crowns. The river does not care who drowns waiting.
    stakes: Ferrymen refuse coin, demand Aether-Glass. Pay (Stress +1) or build a raft (party assigns 3 Easy successes) while
      clock +1.
  - title: Mirror Mirage
    flavor: Heat paints a second party walking your road. They wave with your hands.
    stakes: Heat haze shows a second party walking your road. Ignore it (clock +1 from delay) or follow (roll Omens as if
      at a Gate).
  - title: Burned Waystation
    flavor: Char and bone. Someone fought a Gate omen here and lost the argument.
    stakes: Only charred beams remain. Search (Medium) for a map fragment that reduces next clock tick by 1; failure finds
      corpses and +1 Stress.
  - title: Knight-Errant's Challenge
    flavor: A knight without a kingdom bars the way with courtesy sharp as a spear.
    stakes: A duel for right of way. One character faces a Medium contest; win and clock does not advance; lose and take 1
      hit, clock +1.
  - title: Sinking Cart Road
    flavor: Mud eats wheels the way Debt eats years. Something below the road is drinking.
    stakes: Mud eats wheels. Abandon gear (lose a tool) to keep clock, or labor (Hard Hard, all help with Aids) to haul through.
  - title: Eclipse Noon
    flavor: Shard-dust veils the sun. Birds fall silent; clocks become guesses.
    stakes: 'Shard-dust darkens the sun for an hour. No navigation: auto clock +1, and roll Resonance Stress encounter next.'
  - title: Caged Prophet
    flavor: A cage hangs over the road. The prisoner knows a shorter path and a longer curse.
    stakes: A cage hangs over the road; the prisoner knows a shorter path. Free them (Favor to outlaws, -1 clock) or leave
      them (clock +0, later Debt from their kin).
  - title: Last League Markers
    flavor: Mileposts lean toward your Gate like teeth. The last league always costs more than the map admits.
    stakes: 'You near your destination. Clear the final league Easy or the clock fills: arrive Exhausted (start next combat
      with -1 party die).'
- name: Resonance Stress
  encounters:
  - title: Vein Hum
    flavor: The ground vibrates with crystal song. Even the silent feel lyrics under their skin.
    stakes: 'The ground vibrates with crystal song. Mark +1 Resonance Stress. Medium to tune it out; failure: one character
      gains a minor mutation (cosmetic, -1 CHA checks).'
  - title: Static Kiss
    flavor: Sparks leap to mail and knives. The air tastes of storms that never reach the sky.
    stakes: Sparks leap to metal. Anyone in mail takes 1 hit unless they Guard (Easy) or strip armor for the day.
  - title: Glass Hunger
    flavor: A companion stares at raw shard the way the starved stare at bread.
    stakes: A party member craves raw shard. Spend 1 energy crystal to calm them or mark +2 Stress and they act first in the
      next fight recklessly.
  - title: Echo of Aethelgard
    flavor: A dead world's tongue floods a sleeper's mouth. Morning tastes like starlight and blood.
    stakes: 'A dead language floods a mage''s dreams. Gain a free Lore fact; mark +1 Stress. Refuse the vision: Hard Hard
      or wake with 1 hit.'
  - title: Bleeding Focus
    flavor: Your Aether tools weep red light. Power wants out---or wants you.
    stakes: Aether-Glass tools weep red light. Destroy a crystal focus (-1 Stress) or keep it (+1 Stress, +1 hit on next Arc
      Bolt).
  - title: Chorus of Flies
    flavor: Insects braid toward the most resonant soul. They know who the Shard has already marked.
    stakes: 'Insects swarm toward the most resonant character. Easy to endure; failure: that character cannot Aid until after
      a Campfire.'
  - title: Memory Theft
    flavor: A map detail evaporates mid-thought. The Star-Grave edits travelers.
    stakes: 'Stress flares: cross out one Scout or Lore result you are holding; if you hold none, mark +1 Journey Clock. Recover
      with Campfire Counsel Lore.'
  - title: Crystal Rash
    flavor: Facets bloom under skin overnight---jewelry you cannot pawn.
    stakes: Skin facets appear overnight. +1 Stress. Medium CON-style endurance or gain Disfigured (foes target you first
      once per fight).
  - title: Sympathetic Pain
    flavor: Your nerves braid with your allies'. Their wounds will find you.
    stakes: When any ally takes a hit next combat, you take 1 too until Stress is reduced at camp.
  - title: Oracle Bleed
    flavor: Nosebleeds during planning. Futures leak.
    stakes: Nosebleeds during planning. Seer/Mage may force a reroll on one Journey roll now; mark +2 Stress.
  - title: Hollow Appetite
    flavor: Rations taste of ash and apology. The body refuses comfort while Stress sings.
    stakes: Food tastes like ash. Rations heal nothing until Stress drops; clock still advances if you delay to forage.
  - title: Shard-Twin
    flavor: A crystal double of your party steps from haze---same faces, emptier eyes.
    stakes: You glimpse a crystal double of the party. Strike it (Medium) to -1 Stress or flee (+1 Stress, +1 clock).
  - title: Tuning Fork Bones
    flavor: Joints ache in chord with nearby veins. Every Easy motion feels tuned sharp.
    stakes: Joints ache near veins. -1 die face on all physical Easy actions until camp.
  - title: Gift of Sparks
    flavor: Lightning nests in fingertips. A promise of violence prepaid in Stress.
    stakes: Uncontrolled lightning from fingertips. Free 1 hit to a foe in a future fight, then +1 Stress now.
  - title: Silent Hour
    flavor: Sound dies. Mouths move; meaning arrives late and wrong.
    stakes: 'All sound dies for an hour. Communication only by gesture: next negotiation is Hard Hard; Stress +1.'
  - title: Geode Heartbeat
    flavor: A pulse syncs to the Shard. Guard breaks may miss you---once.
    stakes: A character's pulse syncs to the Shard. +1 Stress; they may ignore one Guard-break once.
  - title: Dust Communion
    flavor: Glittered air offers healing like a cult offers wine.
    stakes: Inhale glittered air. Heal 1 hit and +2 Stress, or hold breath (Easy) with no effect.
  - title: Name in the Glass
    flavor: Crystal shows a loved face begging you deeper. The Motivation grows teeth.
    stakes: Crystal shows a loved one's face asking you to dig deeper. Resist (Medium) or mark a personal Quest Debt and +1
      Stress.
  - title: Overcharge Cache
    flavor: Battery-crystals left by someone who ran. Warm. Waiting.
    stakes: Found battery-crystals. Take them (+1 party energy, +1 Stress each) or smash them (-1 Stress, noise attracts Journey
      encounter).
  - title: Resonance Break
    flavor: The Stress track overflows. Mutation or ruin---the Shard collects either way.
    stakes: Stress track fills. Roll on the Corruption Mutations table now, or burn 2 Favor marks to vent safely; if you can
      do neither, start the next delve unable to Guard in its first round.
- name: Debt & Favors
  encounters:
  - title: Guild Ledger Nail
    flavor: A nail-post lists your names in wet ink. The Guild wants witnesses.
    stakes: 'A nail-post lists your party names. Tear it down (angers guild: +2 Debt) or leave it (collectors arrive next
      town).'
  - title: Interest in Flesh
    flavor: A broker smiles with crystal under the skin of their palm. Debt has new interest rates.
    stakes: A broker offers to clear 1 Debt for a finger's worth of crystal fused to skin (+1 Stress).
  - title: Witness for the Crown
    flavor: Crown agents want testimony. Guilds want silence. You are the hinge.
    stakes: Crown agents demand testimony against a Mining Guild. Testify (Favor with Crown, Debt with Guild) or refuse (Debt
      with Crown).
  - title: Hostage Letter
    flavor: Proof of a relative in a cage. Time is a second creditor.
    stakes: 'Proof a relative is held. Pay 2 crystal/energy or accept a timed Quest: fail and gain Desperate Debt (all Favor
      costs double).'
  - title: Forgiven---For Now
    flavor: A patron clears a mark for one sealed errand. The box hums like an Omen.
    stakes: A patron clears 1 Debt if you carry a sealed box to a Gate. Do not open it (Hard Hard temptation); opening rolls
      an Omen immediately.
  - title: Street Tithe
    flavor: Urchins with Debtknife tattoos ask politely while counting exits.
    stakes: Urchins working for Debtknife gangs demand coin. Pay (clear local heat) or chase them (Medium; failure +1 Debt
      rumor).
  - title: Contract Rewrite
    flavor: A scribe offers to rewrite fate in triplicate. Ink costs more than blood.
    stakes: A scribe can alter your obligation. Hard Hard CHA/INT; success converts Debt to Favor owed by them; failure doubles
      Debt.
  - title: Blood Co-Signer
    flavor: The ledger wants a second signature from someone you love.
    stakes: An ally must co-sign your Debt. They mark +1 personal Debt; party Debt -1.
  - title: Smuggler's Credit
    flavor: Gear now, ruin later. The interest wears a smile.
    stakes: Buy gear on credit. Gain an item; +1 Debt. Default later and lose the item plus a Favor.
  - title: Church of Clearance
    flavor: A cult clears Debt with confession and a brand that towns remember.
    stakes: A cult clears Debt through confession---and public branding. Clear 1 Debt; gain Branded (surface towns hostile
      once).
  - title: Rival Party's Marker
    flavor: Another delve team holds your Favor chit like a knife.
    stakes: 'Another delve team holds your Favor chit. Trade a future aid promise or steal it (Rogue Medium; failure: combat
      stub).'
  - title: Assessor's Scale
    flavor: Officials undervalue crystal unless purity argues back.
    stakes: 'Officials weigh your crystal. Undervalued unless Mage Medium to argue purity; failure: taxed (+1 Debt equivalent).'
  - title: Inheritance Trap
    flavor: A will names you heirs to a bankrupt claim---rights wrapped in rope.
    stakes: A will names you heirs to a bankrupt claim. Accept (+2 Debt, claim rights) or renounce (safe, lose lore hook).
  - title: Favor Called In
    flavor: Someone you owe wants escort. Refuse and make an enemy with a long map.
    stakes: Someone you owe demands escort through a Journey leg. Complete it (-1 Debt) or refuse (+2 Debt, enemy for life).
  - title: Blackmail Plate
    flavor: Your crime etched in plate. Destroy, buy, or let the road force the roll.
    stakes: 'Etched plate shows your crime. Destroy (Medium stealth) or buy silence (1 Favor). Leave it: next roll on this
      table is forced.'
  - title: Debtors' Arena
    flavor: Erase a mark in public bloodsport. The crowd loves a clean ledger.
    stakes: 'Fight as entertainment to erase 1 Debt. One character: win a Medium duel stub; lose and Debt remains +1 Stress.'
  - title: Ledger Fire
    flavor: Guild records burn beautifully. So do the wanted posters that follow.
    stakes: 'Chance to burn guild records. Hard Hard infiltration; success clears 2 Debt; failure: Wanted (all towns +1 Debt).'
  - title: Mercy of the Countess
    flavor: A noble offers Favor for social ruin. Fail and both factions bill you.
    stakes: A noble offers Favor if you ruin a guild rival socially. Succeed Medium intrigue; fail and both factions Debt
      you.
  - title: Child of the Bond
    flavor: A bonded child asks for freedom. Every answer writes Debt somewhere.
    stakes: A bonded child seeks freedom. Free them (Favor with outcasts, Debt with owners) or return them (-1 Debt, +1 Stress).
  - title: Zero Balance Knife
    flavor: An assassin offers to kill your creditor. Blood Favor smells like freedom.
    stakes: Assassin offers to kill your creditor. Accept (Debt clears, gain Blood Favor owed to killer) or refuse (creditor
      warned, +1 Debt).
- name: Shard-Gate Omens
  encounters:
  - title: Falling Sun Echo
    flavor: Daylight burns underground for a minute. The catastrophe still rehearses.
    stakes: 'At the Gate, daylight burns underground for a minute. Next delve: all Strikes +1 hit but Stress +1 when you exit.'
  - title: Three Blind Birds
    flavor: Dead birds fall from the Gate arch. The omen forbids easy flight between heights.
    stakes: 'Dead birds fall from the Gate arch. Omens say: no flying/falling shortcuts; Move between vertical zones costs
      Medium.'
  - title: Mirror Gate
    flavor: The Gate shows you exiting already bloody. Premonition or invitation.
    stakes: 'The Gate shows your party exiting already bloody. Heed it: start with Guard on all, or ignore and first combat
      foes Strike first.'
  - title: Salt Rain
    flavor: White grit falls upward. Water dies; Heal becomes a struggle.
    stakes: White grit falls upward into the Gate. Water rations spoil; next Campfire Heal is Hard Hard.
  - title: Counting Shadows
    flavor: One shadow too many. Something joined the party without asking.
    stakes: 'Shadows don''t match bodies. One shadow too many: a stalker joins the delve (extra foe) unless you leave an offering
      (1 energy).'
  - title: Gate That Breathes
    flavor: Air pulls inward. Easy becomes slightly less easy at the threshold.
    stakes: 'Air pulls inward. First zone: all Easy actions need face 2+. Close visors (no scent clues).'
  - title: Name Spoken Backward
    flavor: A companion's name returns reversed. Hazards learn the Mark.
    stakes: 'Someone says a companion''s name reversed. That character is Marked: hazards target them until a Campfire Lore
      clears it.'
  - title: Glass Teeth
    flavor: The rim grows teeth. Entry bites; failure keeps a trophy.
    stakes: Gate rim grows teeth. Entering deals 1 hit unless Guard Easy. Teeth keep a trophy (item lost) on failure.
  - title: Second Threshold
    flavor: Two Gates overlap like a lie. Left costs Stress; right costs Clock.
    stakes: Two Gates overlap. Choose left (Journey Clock +0, Stress +1) or right (Clock +1, find a Favor token).
  - title: Priestless Blessing
    flavor: A hollow robe bows. Ward for Stress---or walk clean and alone.
    stakes: A hollow robe bows. Accept a ward (one free Guard this delve) and +1 Stress, or pass by clean.
  - title: Red Thread
    flavor: Fate ties two of you. Separate zones bleed.
    stakes: A thread ties two party members. They must share zones this delve or each take 1 hit per separated round.
  - title: Silent Market
    flavor: Ghost stalls sell memories by the ounce.
    stakes: 'Ghost stalls sell memories. Buy (lose a Motivation detail, gain 1 energy) or smash stalls (Omen becomes hostile:
      +1 foe).'
  - title: Clockface Moss
    flavor: Moss grows in clock shapes. Read true or lose hours.
    stakes: 'Moss grows in clock shapes. Read it (Easy): learn exact Journey ticks remaining; misread (fail): Clock +2.'
  - title: Child Gatekeeper
    flavor: A mute child holds the key-crystal. Kindness and cruelty both open doors.
    stakes: A mute child holds the key-crystal. Kindness (Aid Medium) opens safely; cruelty opens but +2 Stress.
  - title: Inverted Drip
    flavor: Water drips up. Resonance will follow your first kill.
    stakes: Water drips up. Next Resonance encounter is mandatory after first combat.
  - title: Banner of the Old World
    flavor: Aethelgard colors flicker. Power for Stress.
    stakes: Aethelgard colors flicker. Mage may learn one free class-flavor cantrip once; Party Stress +1.
  - title: Door of Knives
    flavor: Leave a weapon to enter. Retrieve it---or meet it in a foe's hand.
    stakes: 'Entering requires leaving a weapon. Retrieve on exit Easy; failure: weapon is bound to a foe.'
  - title: Laughing Echo
    flavor: Voices return wrong. Spoken Aid dies; gestures still live.
    stakes: Your voices return wrong. No Aid by speech this delve (Aid still ok by gesture/Easy without voice).
  - title: Omen of Plenty
    flavor: Crystal dew coats you rich. Collectors will smell it.
    stakes: Crystal dew coats you. +1 energy each; next Debt collector knows you struck rich (+1 Debt pressure).
  - title: Sealed With Lead
    flavor: Lead bands the Gate. Break and reroll omen---or walk away ticking.
    stakes: The Gate is lead-banded. Break seal (Hard Hard) and roll again on Omens, or walk away (Clock +1, delve delayed).
- name: Campfire Counsel
  encounters:
  - title: Shared Watch
    flavor: Night around a Gate is never empty. Dice decide who sleeps.
    stakes: 'Assign dice: Scout (Easy) keeps night safe; fail and Journey encounter interrupts sleep (no Heal).'
  - title: Blade and Story
    flavor: Steel and rumor share the firelight. Both can be repaired.
    stakes: Repair (Medium) restores a broken tool; Lore (Easy) reveals a rumor that -1 next Omen severity.
  - title: Confession Circle
    flavor: Fear spoken aloud thins Stress and ties Bonds.
    stakes: Speak a fear. Clear 1 Stress if honest; gain a Bond (once/fight, Aid that ally without energy).
  - title: Ration Argument
    flavor: Hunger makes accountants of friends.
    stakes: 'Split food unfairly. Medium CHA to keep peace; failure: one character refuses Aid tomorrow.'
  - title: Map by Embers
    flavor: Ash is a good ink until the wind edits it.
    stakes: Redraw the route in ash. Success (Easy) -1 Journey Clock; failure smudges map (next travel Lost risk).
  - title: Shard Meditation
    flavor: Vent Stress into flame. Sometimes the flame answers.
    stakes: Mage vents Stress into the fire. -1 Stress; on 1 on a spare d6, fire becomes a hazard (1 hit).
  - title: Silent Meal
    flavor: No talk---only Heal, Guard, and the crackle of distrust.
    stakes: No talk---only dice. Each character may Heal (Easy) or Guard-for-dawn (Easy); no Bargain allowed tonight.
  - title: Trader at the Edge of Light
    flavor: A merchant stands where firelight fails. Prices include theft.
    stakes: A night merchant. Bargain (Medium) for supplies; fail and they steal 1 energy.
  - title: Dream Delve
    flavor: You all dream one room. Map it before it maps you.
    stakes: All dream the same dungeon room. Lore (Medium) to map it; use that map for advantage (one free Easy) next Gate.
  - title: Stitch and Swear
    flavor: Needle, vow, Favor between battered hands.
    stakes: Heal (Medium) removes 1 hit from one character; swear a Vow (mark Favor to each other).
  - title: Burn the Letter
    flavor: Debt evidence curls to smoke---and signals dawn hunters.
    stakes: Destroy Debt evidence in the fire. Clear 1 Debt; smoke signals attract a Journey encounter at dawn.
  - title: Counting Favors
    flavor: Marks rearrange like knives on a table.
    stakes: Publicly track who owes whom. Rearrange 1 Debt/Favor mark between party and NPCs known so far.
  - title: Scarecrow Watch
    flavor: A decoy wears your fear. Ambush may swallow straw instead.
    stakes: 'Build a decoy. Scout success: skip next night ambush; failure: waste materials (lose tool).'
  - title: Bitter Brew
    flavor: 'Alchemist''s tea: heal now, Stress later.'
    stakes: Dust Alchemist-style tea. Heal all 1 hit and +1 Stress each, or skip.
  - title: Naming the Dead
    flavor: Speak the fallen; their kin may answer with Favor.
    stakes: Lore for fallen NPCs. Gain a Favor with their kin faction; Stress -1.
  - title: Sparring Embers
    flavor: Practice cuts that tomorrow might need.
    stakes: Two characters practice. Both spend Medium; both gain +1 face once tomorrow, or take 1 hit on failure.
  - title: False Dawn Pack-Up
    flavor: Leave early and lean; or sleep and owe the Clock nothing.
    stakes: Leave early. Clock -1 but no one Heals; or sleep in (Heal allowed, Clock +0).
  - title: Omen in the Coals
    flavor: Fire previews the Gate---or lies for sport.
    stakes: 'Read fire (Easy WIS). Roll the next Gate Omen now and keep it; on a failure, roll it now but it changes: reroll
      it at the Gate and apply the second result.'
  - title: Last Song
    flavor: A hymn thins Stress and thickens the map for listening foes.
    stakes: 'Anyone sings (Medium CHA). Success: party -1 Stress. Failure: -1 Stress anyway, but the first fight of the next
      delve adds one Minion of your choice to the monsters.'
  - title: Scatter the Ashes
    flavor: Clean camps confuse collectors. Dirty ones invite them.
    stakes: Break camp clean. Next collectors/trackers need Hard Hard to find your trail; fail to scatter and Debt agents
      arrive next stop.
